name: control_g
description: "App de control de gastos personales — local, sin internet."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.2          
  path: ^1.9.0             
  provider: ^6.1.2         
  google_fonts: ^6.2.1     
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

#================================================
#          Cambio del icono de la app
#cambio en el comando, se elimina el :main
#!flutter pub run flutter_launcher_icons:main
#comando nuevo, cambio de icono -> flutter_launcher_icons  ^0.14.1
#flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: img/icono_app.jpeg
  adaptive_icon_foreground: img/icono_app.jpeg
  adaptive_icon_background: "#FFFFFF"
  android: true
#================================================